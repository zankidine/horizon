<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15181c" />
    <title>Horizon : démo audio</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #15181c; color: #e8ecef; max-width: 40rem; }
      h1 { font-size: 1.3rem; }
      h2 { font-size: 1.05rem; margin-top: 1.6rem; }
      button { font: inherit; min-height: 44px; margin: 4px 4px 4px 0; padding: 0 14px; border-radius: 8px; border: 1px solid #50606c; background: #24303a; color: inherit; }
      button[aria-pressed='true'] { background: #2f6f4f; }
      label { display: block; margin: 8px 0; }
      input[type='range'] { width: 60%; vertical-align: middle; }
      input[type='text'] { font: inherit; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 10px; }
      .alerte { color: #f0c36b; }
      pre { white-space: pre-wrap; background: #0d1114; padding: 10px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="demo"></div>
    <script type="module" src="/src/lib/audio/demo.ts"></script>
  </body>
